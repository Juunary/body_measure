# Fly.io deployment for the Maß-DPP studio.
#
#   flyctl deploy --config studio/fly.toml --dockerfile studio/Dockerfile .
#
# run from the ITA root (the build context). First time:
#   flyctl apps create ita-mass-dpp-studio
#   flyctl volumes create studio_data --region fra --size 3 -a ita-mass-dpp-studio
#   flyctl secrets set STUDIO_PASSWORD=... -a ita-mass-dpp-studio
#
# The page's own origin is what the QR encodes, so the app name is the
# link on every printed code; rename before the first label, not after.

app = "ita-mass-dpp-studio"
primary_region = "fra"   # Frankfurt — nearest region to Aachen

[build]
  dockerfile = "studio/Dockerfile"

[env]
  STUDIO_LANG = "en"
  STUDIO_STATE_DIR = "/data"
  STUDIO_EXTRA_DATA = "/data/scans"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[http_service.http_options.response.headers]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"

# Uploads, results and the deployed scans outlive a restart on the volume.
# Volumes are per machine, so this stays a single machine.
[[mounts]]
  source = "studio_data"
  destination = "/data"

[checks.health]
  type = "http"
  port = 8080
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"

# trimesh + scipy on a 100 k-face scan want memory more than cores
[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
