name: studio

on:
  push:
    branches: [main]
    paths:
      - "body_measure/**"
      - "measurement-spec.v1.yaml"
      - "studio/**"
      - "polo-line-sim/**"
      - "qr-configurator"
      - ".gitmodules"
      - ".dockerignore"
      - ".github/workflows/studio.yml"
  pull_request:
    paths:
      - "body_measure/**"
      - "measurement-spec.v1.yaml"
      - "studio/**"
      - "polo-line-sim/**"
      - "qr-configurator"
      - ".gitmodules"
      - ".dockerignore"
      - ".github/workflows/studio.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: studio/requirements.txt
      - run: pip install -r studio/requirements.txt
      - name: Polo process model
        run: python -m unittest
        working-directory: polo-line-sim
      - name: Studio
        run: python -m pytest -q -p no:cacheprovider
        working-directory: studio
        env:
          PYTHONUTF8: "1"
