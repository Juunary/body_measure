name: studio

on:
  push:
    branches: [main]
    paths:
      - "body_measure/**"
      - "measurement-spec.v1.yaml"
      - "studio/**"
      - "polo-line-sim/**"
      - "qr-configurator"
      - ".gitmodules"
      - ".dockerignore"
      - ".github/workflows/studio.yml"
  pull_request:
    paths:
      - "body_measure/**"
      - "measurement-spec.v1.yaml"
      - "studio/**"
      - "polo-line-sim/**"
      - "qr-configurator"
      - ".gitmodules"
      - ".dockerignore"
      - ".github/workflows/studio.yml"
  workflow_dispatch:

jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: studio/requirements-factory.txt
      - run: pip install -r studio/requirements-factory.txt
      - name: Public factory engine and CLI (no QR checkout)
        run: python -m pytest factory_tests -q -p no:cacheprovider
        working-directory: studio
        env:
          PYTHONUTF8: "1"
      - name: Factory scale benchmark
        run: python -m studio.factory.benchmark --out runs/factory-benchmark.json --report runs/factory-benchmark.md
        working-directory: studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-benchmark
          path: studio/runs/factory-benchmark.*
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out private QR dependency
        id: qr
        shell: bash
        env:
          QR_TOKEN: ${{ secrets.QR_CONFIGURATOR_TOKEN }}
        run: |
          if [ -z "$QR_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Studio web tests need QR_CONFIGURATOR_TOKEN. Public factory and polo tests run without it."
            exit 0
          fi
          git config url."https://x-access-token:${QR_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: studio/requirements.txt
      - name: Polo process model
        run: python -m unittest
        working-directory: polo-line-sim
      - name: Install Studio dependencies
        if: steps.qr.outputs.available == 'true'
        run: pip install -r studio/requirements.txt
      - name: Studio
        if: steps.qr.outputs.available == 'true'
        run: python -m pytest -q -p no:cacheprovider
        working-directory: studio
        env:
          PYTHONUTF8: "1"
