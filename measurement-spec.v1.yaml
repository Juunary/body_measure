# measurement-spec v1
# 치수 이름이 아니라 정의가 계약이다. 코드는 이 파일의 6개 키를 정확히 구현해야 한다.
# definition_verified: ISO 8559-1 원문 대조 완료 여부 (ITA 도서관 태스크 전까지 false).
# implementation_status: not_implemented | implemented_v1 | ...

spec_version: 8          # v8: back_length 를 선언대로 시상면 절단으로 (결정 #48); v7: waist 를 자연 허리 띠의 중간으로 (결정 #47); v6: upper_arm_girth 팔 축 수직 (결정 #46); v5: plausible_mm (결정 #39)
standard: ISO 8559-1
posture_default: standing

# 제품 전제: 1단계는 반팔 셔츠. 긴팔 확장은 미확정.
# 반팔은 소매 끝이 위팔에 직접 닿으므로 upper_arm_girth 가 필수이고,
# sleeve_length 는 신체 치수라기보다 디자인 선택에 가까워져 허용오차가 느슨하다.
# sleeve_length 는 제거하지 않는다 — 이미 구현돼 있고 긴팔 확장 시 필요하다.
#
# 범위 (2026-08-25): 착의 상태에서 다루는 대상은 상의로 한정한다. 반팔이므로
# 팔꿈치 아래는 우선순위가 낮다. priority 필드가 이를 기록한다:
#   core     — 이 옷을 만드는 데 반드시 필요. 실패하면 슬라이스가 막힌다.
#   deferred — 지금 제품에는 불필요. 실패해도 슬라이스를 막지 않지만
#              조용히 빠지지도 않는다 (보고서에 항상 표기).
# priority 는 난이도가 아니라 범위다. sleeve_length 는 잘 작동하지만
# 손목까지 가는 유일한 측정이라 지금 제품 밖에 있다. 긴팔로 확장하면
# 여기만 core 로 되돌리면 된다 — 정의도 구현도 그대로 남아 있다.

# plausible_mm [lo, hi] — 인체 범위 게이트 (measure/range_gate.py, 결정 #39).
# 이 밖의 값은 코어가 거부한다: null + outside_plausible_range. 보정하지 않는다.
# 값의 출처: 결정 #20 이후 scripts/clothing_offset_report.py 가 보고서 수준에서
# 지니던 PLAUSIBLE_MM 를 2026-09-02 에 그대로 옮긴 것이다 — "실제 몸이 걸리지
# 않을 만큼 넉넉한 성인 범위이며, 착의 스캔은 모든 둘레를 부풀리므로 상한이
# 이를 허용한다". 인구 통계표가 아니다. 예외 하나는 해당 항목에 인라인 주석.

measurements:
  chest_circumference:
    plausible_mm: [600, 1600]
    definition: horizontal_torso_girth_at_maximum_chest_level
    definition_verified: false
    method: plane_slice
    plane: horizontal            # v1; 실제 ISO 정의가 경사면이면 spec_version 올려서 변경
    landmarks: [chest_level]
    known_deviations:
      - arm_interference_requires_torso_loop_selection
      - arms_merged_above_armpit_are_clipped_at_torso_x_range   # 실데이터 자세 대응, 항상 플래그
    priority: core
    implementation_status: implemented_v1
    no_reference: false          # SMPL-Anthropometry chest circumference와 대조 (T-pose 트랙)

  waist_circumference:
    plausible_mm: [500, 1600]
    definition: natural_waist_girth_between_lowest_rib_and_iliac_crest   # ISO 8559-1 5.3.10
    definition_verified: false
    method: plane_slice
    plane: horizontal
    # v7 (결정 #47): 허리 높이 = 둘레 최소점(늑골 아래 좁아짐)과 요추 오목점(등의 가장 오목한 곳)의 중간.
    # 둘레 최소가 탐색 경계에 걸리면(배가 엉덩이보다 큰 몸) 오목점만, 방향을 모르면 둘레 최소만(플래그).
    landmarks: [waist_level, girth_minimum_level, lumbar_concavity_level]
    known_deviations:
      - band_bounds_are_girth_minimum_and_back_concavity_not_rib_and_crest_landmarks
      - girth_minimum_only_when_front_back_orientation_unknown
    priority: core
    implementation_status: implemented_v2
    no_reference: false             # Texel m16 (5.3.10); v1 was compared to m102

  neck_circumference:
    plausible_mm: [250, 600]
    definition: neck_base_girth
    definition_verified: false
    method: plane_slice
    plane: horizontal            # v1 수평 근사; ISO는 경사(7번 경추 경유) — known_deviations 참조
    landmarks: [neck_base_level]
    known_deviations:
      - horizontal_slice_v1_iso_defines_inclined_plane_through_c7
    priority: core
    implementation_status: implemented_v1
    no_reference: false

  upper_arm_girth:
    plausible_mm: [180, 600]
    definition: maximum_girth_of_the_upper_arm
    definition_verified: false      # ISO 8559-1 5.3.16 원문 대조 전
    method: plane_slice
    plane: perpendicular_to_arm_axis   # v6: 수평 루프 중심점을 지나는 직선에 수직 (결정 #46)
    landmarks: [armpit_level, wrist_point, arm_axis]
    side: right                     # Texel m15_r / NOMO Bicep_Circ 와 대조
    known_deviations:
      - arm_axis_is_a_straight_line_through_horizontal_loop_centroids_v2
      - horizontal_slice_fallback_when_axis_unresolved_flagged
      - search_window_bounded_by_armpit_and_wrist_no_elbow_landmark
    priority: core
    implementation_status: plane_slice_v2
    no_reference: false             # Texel m15 (5.3.16), NOMO Bicep_Circ

  across_back_shoulder_width:
    plausible_mm: [250, 650]
    definition: surface_path_left_shoulder_to_right_shoulder_through_back_neck_point
    definition_verified: false
    method: surface_path
    route: [shoulder_point_left, back_neck_point, shoulder_point_right]  # 경유점 강제
    requires: [front_back_orientation, back_neck_point, shoulder_points]
    known_deviations:
      - edge_graph_approximation
      - acromion_approximated_as_top_of_surface_above_armpit_crease
    priority: core
    implementation_status: implemented_v1
    no_reference: false          # Texel m1 "Across Back Shoulder Width (through the
                                 # back neck point)" — 경유점까지 정의 일치, 감사 판정 exact.
                                 # 2026-08-17에 '직선거리라 비교 금지'로 적었으나
                                 # 2026-08-18 measurement-audit.md가 이를 뒤집음 (결정 #32)

  sleeve_length:
    # PLAUSIBLE_MM 은 1000 이었다. v1 은 팔꿈치 경유점을 생략해 계통적으로
    # 약 +200mm 과대이고 (known_deviations), Texel 의 clean 값이 860~1055mm 라
    # 1000 이면 검증된 몸을 거부한다. 팔꿈치 경유점이 구현되면 1000 으로 되돌린다.
    plausible_mm: [400, 1250]
    definition: back_neck_point_to_wrist_length_over_shoulder_and_elbow
    definition_verified: false
    method: surface_path
    route: [back_neck_point, shoulder_point_right, elbow_point_right, wrist_point_right]  # 구간 합
    posture: elbow_bent
    requires: [front_back_orientation, back_neck_point, shoulder_points, wrist_point]
    known_deviations:
      - approximated_in_a_pose_straight_arm_underestimates_bent_elbow
      - edge_graph_approximation
      - elbow_waypoint_omitted_in_v1_systematic_overshoot_observed   # Part 1: +197mm 평균
    priority: deferred   # 손목까지 가는 유일한 측정 — 긴팔 확장 시 core 로
    implementation_status: implemented_v1
    no_reference: true           # 레퍼런스의 arm length는 정의 상이 — 비교 금지

  back_length:
    plausible_mm: [300, 650]
    definition: back_neck_point_to_waist_level_along_back_surface
    definition_verified: false
    method: sagittal_slice_polyline
    route: [back_neck_point, waist_level]
    requires: [front_back_orientation, back_neck_point]
    known_deviations: []   # v8: 결정 #48 로 실제 시상면 절단이 됨
    priority: core
    implementation_status: implemented_v1
    no_reference: false          # Texel m3 (5.4.5), audit 판정 approximate — 결정 #32 의
                                 # 규칙대로 audit 이 우선. 이 플래그는 #48 에서 정정됨
